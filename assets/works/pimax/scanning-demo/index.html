<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Light recognition demo</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#181818}.phone-shell{position:absolute;top:50%;left:50%;width:375px;height:813px;border:0;border-radius:34.2px;clip-path:inset(0 round 34.2px);transform-origin:center;overflow:hidden;isolation:isolate;-webkit-mask-image:-webkit-radial-gradient(white,black);}iframe{display:block;width:100%;height:100%;border:0;background:transparent;}</style></head><body><div class="phone-shell"><iframe title="Automatic light recognition, save and effect switching" src="phone.html"></iframe></div><script>const phone=document.querySelector('.phone-shell');function fit(){phone.style.transform=`translate(-50%,-50%) scale(${innerWidth/940*249/375})`}addEventListener('resize',fit);fit();</script></body></html>
